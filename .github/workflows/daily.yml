name: storyloop-daily
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 08:00 القاهرة
  workflow_dispatch: {}

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run migrate
      - run: pip install edge-tts
      - run: npm run daily
        continue-on-error: true   # فشل مشهد ما يمنعش تجميع القصص الجاهزة
      - run: npm run finish
      - uses: actions/upload-artifact@v4
        with:
          name: final-videos
          path: out/**/final.mp4
          if-no-files-found: ignore
          retention-days: 7
