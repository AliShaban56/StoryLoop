name: storyloop-daily
on:
  schedule:
    - cron: '0 6 * * *' # 08:00 Africa/Cairo
  workflow_dispatch: {}

concurrency:
  group: storyloop-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TURSO_DATABASE_URL: \${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: \${{ secrets.TURSO_AUTH_TOKEN }}
      ADMIN_PASSWORD: \${{ secrets.ADMIN_PASSWORD }}
      AGNES_API_KEY_1: \${{ secrets.AGNES_API_KEY_1 }}
      AGNES_API_KEY_2: \${{ secrets.AGNES_API_KEY_2 }}
      AGNES_API_KEY_3: \${{ secrets.AGNES_API_KEY_3 }}
      AGNES_API_KEY_4: \${{ secrets.AGNES_API_KEY_4 }}
      AGNES_API_KEY_5: \${{ secrets.AGNES_API_KEY_5 }}
      FOX_REFERENCE_IMAGE_URL: \${{ secrets.FOX_REFERENCE_IMAGE_URL }}
      KV_REST_API_URL: \${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: \${{ secrets.KV_REST_API_TOKEN }}
      FAL_KEY: \${{ secrets.FAL_KEY }}
      FAL_I2V_MODEL: \${{ vars.FAL_I2V_MODEL }}
      SCENES_PER_VIDEO: 8
      VIDEOS_PER_DAY: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run migrate
      - run: pip install edge-tts
      - run: npm run daily
      - run: npm run finish
      - uses: actions/upload-artifact@v4
        with:
          name: storyloop-final-videos
          path: out/**/final.mp4
          if-no-files-found: ignore
          retention-days: 7
